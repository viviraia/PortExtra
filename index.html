<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a12" />
    <meta name="description" content="Hollow Spire — descend a procedurally generated castle in this 2D action roguelite." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%230b0a12%22/%3E%3Cpath d=%22M7 2h2v2h1v3h1v7H5V7h1V4h1z%22 fill=%22%233a3350%22/%3E%3Crect x=%227%22 y=%228%22 width=%222%22 height=%222%22 fill=%22%23ff9a3a%22/%3E%3C/svg%3E" />
    <title>Hollow Spire</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0a12; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b0a12; color: #e8dcc8;
        font: 16px/1.4 monospace; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
      #rotate .phone { width: 34px; height: 56px; border: 3px solid #e8dcc8; border-radius: 6px; animation: turn 2s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div>Rotate your device<br />to climb the Spire</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
